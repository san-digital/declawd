name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s reference -p 'test_*.py' -v

  rust-osv:
    name: Full Rust OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/install-osv-scanner.py "$RUNNER_TEMP/osv-scanner"
      - name: Scan every Cargo.lock package
        run: OSV_SCANNER="$RUNNER_TEMP/osv-scanner" python3 scripts/check-rust-osv.py --output "$RUNNER_TEMP/rust-osv.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-osv
          path: ${{ runner.temp }}/rust-osv*.json
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-security-advisories.sh --policy-only
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-ghsas: GHSA-c38w-74pg-36hr,GHSA-4grx-2x9w-596c

  trustmark-evidence:
    name: TrustMark frozen evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: --requirement experiments/trustmark-v1/verifier-requirements.txt
      - run: python3 experiments/trustmark-v1/verify.py --pixels
      - run: python3 -B -m unittest discover -s experiments/trustmark-v1 -p 'test_*.py' -v

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify canonical release manifest bytes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $generated = Join-Path $env:RUNNER_TEMP "release-manifest-v1.json"
          python scripts/generate-release-manifest.py --output $generated
          $expectedBytes = [IO.File]::ReadAllBytes("release-manifest-v1.json")
          $generatedBytes = [IO.File]::ReadAllBytes($generated)
          if (-not [Linq.Enumerable]::SequenceEqual($expectedBytes, $generatedBytes)) {
            throw "Windows release manifest bytes differ from the committed contract"
          }
      - run: cargo test --all-targets --locked

  quality:
    name: Format, lint, pins and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo package --locked
      - run: ./scripts/check-c2pa-pin.sh
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit@0.22.0
      - run: ./scripts/check-security-advisories.sh
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-about@0.8.4
      - run: ./scripts/check-third-party-licences.sh
      - name: Verify the frozen Python runtime closure
        run: python3 scripts/check-python-runtime-lock.py
      - name: Audit every frozen Python runtime package
        shell: bash
        run: |
          audit_environment="$RUNNER_TEMP/declawd-python-audit"
          python3 -m venv "$audit_environment"
          "$audit_environment/bin/python" -m pip install --requirement reference/python-audit-tool-requirements.txt
          PATH="$audit_environment/bin:$PATH" "$audit_environment/bin/python" scripts/check-python-advisories.py
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Install the pinned Python SBOM tool
        run: python3 -m pip install --requirement reference/sbom-tool-requirements.txt
      - name: Generate and validate the reproducible SBOM
        run: ./scripts/check-sbom.sh
      - name: Generate and validate the Python runner SBOM
        run: ./scripts/check-python-sbom.sh
      - name: Verify SBOMs across clean source checkouts
        run: ./scripts/check-sboms-clean-checkouts.sh
      - name: Verify the deterministic SynthID teaching bundle
        run: ./scripts/check-synthid-bundle.sh

  c2patool-oracle:
    name: Linux c2patool oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --locked
      - name: Install pinned oracle
        run: cargo install c2patool --version 0.27.12 --locked
      - name: Validate test-signed fixtures and cleaned outputs
        run: ./scripts/check-c2patool-fixtures.sh

  synthid-gpt2-oracle:
    name: SynthID GPT-2 oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Reproduce the token trace and compare the pinned oracle
        shell: bash
        run: |
          runner_environment="$RUNNER_TEMP/declawd-synthid-runtime"
          python3 -m venv "$runner_environment"
          "$runner_environment/bin/python" -m pip install --require-hashes --requirement reference/synthid-runner-linux-cpu.lock
          "$runner_environment/bin/python" -m pip check
          upstream="$RUNNER_TEMP/synthid-text-0.2.1"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/google-deepmind/synthid-text.git
          git -C "$upstream" fetch --depth 1 origin 8f2e2316904ea7291ac96e30eb394c453dcc577b
          git -C "$upstream" checkout --detach FETCH_HEAD
          PATH="$runner_environment/bin:$PATH" DECLAWD_SYNTHID_UPSTREAM="$upstream" ./scripts/check-synthid-gpt2.sh
