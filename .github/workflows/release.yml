name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s reference -p 'test_*.py' -v
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Require the tag to match the package version
        shell: bash
        run: |
          package_version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - run: cargo package --locked
      - run: ./scripts/check-c2pa-pin.sh
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-audit@0.22.0
      - run: ./scripts/check-security-advisories.sh
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-about@0.8.4
      - run: ./scripts/check-third-party-licences.sh
      - run: cargo build --locked
      - run: cargo install c2patool --version 0.27.12 --locked
      - run: ./scripts/check-c2patool-fixtures.sh
      - name: Verify committed contract digests
        run: |
          cp release-manifest-v1.json /tmp/release-manifest-v1.json
          python3 scripts/generate-release-manifest.py
          cmp release-manifest-v1.json /tmp/release-manifest-v1.json

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir stage
          cp "target/${TARGET}/release/declawd" stage/
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.txt stage/
          python3 scripts/generate-release-manifest.py --release "$RELEASE_NAME" --source-revision "$(git rev-parse HEAD)" --output stage/release-manifest-v1.json
          archive="declawd-${RELEASE_NAME}-${TARGET}.tar.gz"
          tar -czf "$archive" -C stage .
          shasum -a 256 "$archive" > "${archive}.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory stage
          Copy-Item "target/$env:TARGET/release/declawd.exe" stage/
          Copy-Item LICENSE,NOTICE,THIRD_PARTY_LICENSES.txt stage/
          $sourceRevision = git rev-parse HEAD
          python scripts/generate-release-manifest.py --release $env:RELEASE_NAME --source-revision $sourceRevision --output stage/release-manifest-v1.json
          $archive = "declawd-$env:RELEASE_NAME-$env:TARGET.zip"
          Compress-Archive stage/* $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  $archive" | Out-File -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            declawd-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Add immutable source-contract manifest
        shell: bash
        run: |
          python3 scripts/generate-release-manifest.py \
            --release "$GITHUB_REF_NAME" \
            --source-revision "$(git rev-parse HEAD)" \
            --output "dist/declawd-${GITHUB_REF_NAME}-source-contract.json"
          shasum -a 256 "dist/declawd-${GITHUB_REF_NAME}-source-contract.json" \
            > "dist/declawd-${GITHUB_REF_NAME}-source-contract.json.sha256"
      - name: Verify every release checksum
        shell: bash
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
