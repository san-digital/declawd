name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s reference -p 'test_*.py' -v
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Require the tag to match the package version
        shell: bash
        run: |
          package_version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - run: cargo package --locked
      - run: ./scripts/check-c2pa-pin.sh
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-audit@0.22.0
      - run: ./scripts/check-security-advisories.sh
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-about@0.8.4
      - run: ./scripts/check-third-party-licences.sh
      - name: Verify the frozen Python runtime closure
        run: python3 scripts/check-python-runtime-lock.py
      - name: Audit every frozen Python runtime package
        shell: bash
        run: |
          audit_environment="$RUNNER_TEMP/declawd-python-audit"
          python3 -m venv "$audit_environment"
          "$audit_environment/bin/python" -m pip install --requirement reference/python-audit-tool-requirements.txt
          PATH="$audit_environment/bin:$PATH" "$audit_environment/bin/python" scripts/check-python-advisories.py
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Install the pinned Python SBOM tool
        run: python3 -m pip install --requirement reference/sbom-tool-requirements.txt
      - name: Generate and validate the reproducible SBOM
        run: ./scripts/check-sbom.sh
      - name: Generate and validate the Python runner SBOM
        run: ./scripts/check-python-sbom.sh
      - name: Verify SBOMs across clean source checkouts
        run: ./scripts/check-sboms-clean-checkouts.sh
      - name: Verify the deterministic SynthID teaching bundle
        run: ./scripts/check-synthid-bundle.sh
      - run: cargo build --locked
      - run: cargo install c2patool --version 0.27.12 --locked
      - run: ./scripts/check-c2patool-fixtures.sh
      - name: Verify committed contract digests
        run: |
          cp release-manifest-v1.json /tmp/release-manifest-v1.json
          python3 scripts/generate-release-manifest.py
          cmp release-manifest-v1.json /tmp/release-manifest-v1.json
      - name: Install the pinned GPT-2 oracle runtime
        run: |
          runner_environment="$RUNNER_TEMP/declawd-synthid-runtime"
          python3 -m venv "$runner_environment"
          "$runner_environment/bin/python" -m pip install --require-hashes --requirement reference/synthid-runner-linux-cpu.lock
          "$runner_environment/bin/python" -m pip check
          upstream="$RUNNER_TEMP/synthid-text-0.2.1"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/google-deepmind/synthid-text.git
          git -C "$upstream" fetch --depth 1 origin 8f2e2316904ea7291ac96e30eb394c453dcc577b
          git -C "$upstream" checkout --detach FETCH_HEAD
          echo "$runner_environment/bin" >> "$GITHUB_PATH"
          echo "DECLAWD_SYNTHID_UPSTREAM=$upstream" >> "$GITHUB_ENV"
      - name: Reproduce the GPT-2 token trace and DeepMind oracle
        run: ./scripts/check-synthid-gpt2.sh

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir stage
          cp "target/${TARGET}/release/declawd" stage/
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.txt SYNTHID_THIRD_PARTY_NOTICES.md stage/
          python3 scripts/generate-release-manifest.py --release "$RELEASE_NAME" --source-revision "$(git rev-parse HEAD)" --output stage/release-manifest-v1.json
          archive="declawd-${RELEASE_NAME}-${TARGET}.tar.gz"
          tar -czf "$archive" -C stage .
          shasum -a 256 "$archive" > "${archive}.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory stage
          Copy-Item "target/$env:TARGET/release/declawd.exe" stage/
          Copy-Item LICENSE,NOTICE,THIRD_PARTY_LICENSES.txt,SYNTHID_THIRD_PARTY_NOTICES.md stage/
          $sourceRevision = git rev-parse HEAD
          python scripts/generate-release-manifest.py --release $env:RELEASE_NAME --source-revision $sourceRevision --output stage/release-manifest-v1.json
          $archive = "declawd-$env:RELEASE_NAME-$env:TARGET.zip"
          Compress-Archive stage/* $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$archive.sha256", "$digest  $archive`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            declawd-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Install the pinned Python SBOM tool
        run: python3 -m pip install --requirement reference/sbom-tool-requirements.txt
      - name: Add immutable source-contract manifest
        shell: bash
        run: |
          contract="declawd-${GITHUB_REF_NAME}-source-contract.json"
          python3 scripts/generate-release-manifest.py \
            --release "$GITHUB_REF_NAME" \
            --source-revision "$(git rev-parse HEAD)" \
            --output "dist/${contract}"
          (cd dist && shasum -a 256 "$contract" > "${contract}.sha256")
      - name: Add reproducible CycloneDX SBOM
        shell: bash
        run: |
          sbom="declawd-${GITHUB_REF_NAME}.cdx.json"
          python3 scripts/generate-sbom.py --output "dist/${sbom}"
          (cd dist && shasum -a 256 "$sbom" > "${sbom}.sha256")
      - name: Add reproducible Python runner SBOM
        shell: bash
        run: |
          sbom="declawd-${GITHUB_REF_NAME}-python.cdx.json"
          python3 scripts/generate-python-sbom.py --output "dist/${sbom}"
          (cd dist && shasum -a 256 "$sbom" > "${sbom}.sha256")
      - name: Add deterministic SynthID teaching bundle
        shell: bash
        run: |
          bundle="declawd-${GITHUB_REF_NAME}-synthid-contracts.tar.gz"
          python3 scripts/generate-synthid-bundle.py --output "dist/${bundle}"
          (cd dist && shasum -a 256 "$bundle" > "${bundle}.sha256")
      - name: Verify byte-identical embedded source contracts
        shell: bash
        run: |
          expected_contract="dist/declawd-${GITHUB_REF_NAME}-source-contract.json"
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu
          do
            archive="dist/declawd-${GITHUB_REF_NAME}-${target}.tar.gz"
            cmp "$expected_contract" <(tar -xOf "$archive" ./release-manifest-v1.json)
          done
          windows_archive="dist/declawd-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
          cmp "$expected_contract" <(unzip -p "$windows_archive" release-manifest-v1.json)
      - name: Verify every release checksum
        shell: bash
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
